name: Deploy Lúmina

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Copiar .env.local
        run: cp ~/.env.local .env.local

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Reiniciar con PM2
        run: |
          pm2 describe lumina > /dev/null 2>&1 \
            && pm2 restart lumina \
            || pm2 start npm --name lumina -- start
          pm2 save
